services:
  web2yt:
    build: .
    container_name: web2yt
    restart: unless-stopped
    environment:
      DISPLAY: ":99"
      WIDTH: "1920"
      HEIGHT: "1080"
      FPS: "30"
      CHROME_BIN: "chromium"

      # Set this to your transcription UI (or any webpage)
      WEB_URL: "http://boondock-test:4000"

      # YouTube ingest + stream key
      YT_RTMPS_URL: "rtmps://a.rtmps.youtube.com/live2"
      YT_STREAM_KEY: "m8ef-j663-j7be-92s5-4gsd"

      # Encoding (tuned for 1080p30 with voice + animations)
      VIDEO_BITRATE: "6500k"
      VIDEO_MAXRATE: "7500k"
      VIDEO_BUFSIZE: "13000k"
      AUDIO_BITRATE: "160k"
      # Optional Puppeteer login automation
      LOGIN_USER: "admin@boondock.cloud"
      LOGIN_PASS: "B00nd0ck@Ech0"
      LOGIN_USER_SELECTOR: "input[placeholder='User ID'], input[autocomplete='username']"
      LOGIN_PASS_SELECTOR: "input[placeholder='Password'], input[autocomplete='current-password']"
      LOGIN_SUBMIT_SELECTOR: "button[type='submit']"
      # LOGIN_SUCCESS_SELECTOR: ".your-post-login-selector"
    shm_size: "1g"
    # Uncomment if WEB_URL points to a service running on the Docker host
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
